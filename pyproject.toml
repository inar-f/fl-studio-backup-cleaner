[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fl-backup-cleaner"
version = "1.0.0"
description = "A Windows utility for cleaning FL Studio backup folders."
authors = [{ name = "RaniFar" }]
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }

dependencies = [
    "PySide6>=6.6",
    "send2trash>=1.8.3",
]

[tool.setuptools.packages.find]
where = ["src"]